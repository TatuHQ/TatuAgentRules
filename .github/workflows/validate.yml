name: Validate rules

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check-rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check AgentRules
        run: ./scripts/check-rules.sh

  actionlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint workflows
        run: docker run --rm -v "$PWD:/repo:ro" --workdir /repo rhysd/actionlint:1.7.12 -color
